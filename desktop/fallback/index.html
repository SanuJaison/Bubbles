<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubbles</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        align-items: center;
        background: #0b0b10;
        color: #f5f3ff;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 0.75rem;
      }

      p {
        color: #c4b5fd;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }

      a {
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        border-radius: 0.75rem;
        color: white;
        display: inline-block;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bubbles</h1>
      <p>
        The desktop app could not load the Bubbles web app. Check your internet
        connection and try again.
      </p>
      <a href="https://bubbles-zeta-nine.vercel.app">Open Bubbles</a>
    </main>
  </body>
</html>
