[package]
name = "bubbles"
version = "1.0.1"
description = "Bubbles desktop chat app"
authors = ["Bubbles"]
edition = "2021"

[lib]
name = "bubbles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
