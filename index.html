        "operatingSystem": "Web",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Bubbles free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Bubbles is free to use. It started as a personal project, and anyone is welcome to use it."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can sign up with email or Google. New email accounts need to verify their address before signing in."
            }
          },
          {
            "@type": "Question",
            "name": "Are calls available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Voice and video calls work in the web app today. The Android app will show the call buttons from the first release; mobile calling is coming in a later update."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use Bubbles on my phone now?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Open the web app in your mobile browser. The native Android app is in development."
            }
          },
          {
            "@type": "Question",
            "name": "How will I install the Android app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When the APK is released, download it, open it, and allow installs from your browser if Android asks. The Play Store release can come later."
            }
          },
          {
            "@type": "Question",
            "name": "Will there be an iOS app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Maybe later. iOS builds need a Mac and an Apple Developer account, so Android and Windows come first."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your chats are only shown to the people in the conversation. Read the Privacy Policy for the full details."
            }
          },
          {
            "@type": "Question",
            "name": "How do I report a bug?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open the Feedback page from the navigation. Include what you were doing and what went wrong, and leave an email if you would like a reply."
            }
          }
        ]
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem("theme") || "system";
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var isDark =
            stored === "dark" || (stored === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark
            ? "dark"
            : "light";
        } catch (error) {}
      })();
    </script>
